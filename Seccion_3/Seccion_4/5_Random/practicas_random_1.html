<!DOCTYPE html>
<html>
<head>
    <title>Random 1</title>
</head>
<body>
    <p>
        <button onclick="mostrarMensaje()">Click aquí</button>
    </p>
    <script>
        function mostrarMensaje() {
            let aleatorio = Math.random() * (50 - 10) + 10;
            alert(aleatorio);
        }
    </script>
</body>
</html>
