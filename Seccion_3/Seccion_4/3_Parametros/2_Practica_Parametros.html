<!DOCTYPE html>

<head>
    <title>Parámetros 2</title>
</head>

<body>
    <p>
        <button onclick="mostrarMensaje('¡Hola, este es el mensaje!')">Click aqui</button>
    </p>
    <script>
        function mostrarMensaje(mensaje) {
            alert(mensaje);
        }
    </script>
</body>

</html>
