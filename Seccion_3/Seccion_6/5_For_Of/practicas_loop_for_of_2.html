<!DOCTYPE html>
<html>
    <head>
        <title>Loop For Of</title>
    </head>
    <body>
        <script>
            let miArray = [ 'Mensaje 1', 'Mensaje 2', 'Mensaje 3' ];

            function testLoop(mensajes) {
                for (let mensaje of mensajes) {
                    console.log(mensaje);
                }
            }

            testLoop(miArray);
        </script>
    </body>
</html>
