<!DOCTYPE html>
<html>
    <head>
        <title>Practica 2</title>
    </head>
    <body>
        <script>
            function testLoop(numero) {
                while (numero <= 10) {
                    console.log(numero);
                    numero++;
                }
            }

            let entradaUsuario = prompt("Dime el número inicial");
            let numeroInicial = parseInt(entradaUsuario);

            testLoop(numeroInicial);
        </script>
    </body>
</html>
