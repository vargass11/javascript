<!DOCTYPE html>
<html>
    <head>
        <title>Loop Do...</title>
    </head>
    <body>
        <script>
            let nombre;
            do{
                nombre = prompt("Dime mi nombre");
            } while (nombre != "Mathyas");

            document.write("<h1>Ese es mi nombre!</h1>")
        </script>
    </body>
</html>
