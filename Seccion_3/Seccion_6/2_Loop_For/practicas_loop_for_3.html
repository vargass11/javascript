<!DOCTYPE html>
<html>
<head>
    <title>Loop For 3</title>
</head>
<body>

    <script>
        function testLoop() {
            let suma = 0;
            for (let i = 1; i <= 4; i++) {
                suma = suma + i;
            }
            console.log(suma);
        }
        
        testLoop();
    </script>

</body>
</html>
